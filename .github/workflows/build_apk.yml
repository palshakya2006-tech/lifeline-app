name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Create google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "176912889439",
              "project_id": "lifeline-61f28",
              "storage_bucket": "lifeline-61f28.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:176912889439:android:84732855c955af31e7cdea",
                  "android_client_info": {
                    "package_name": "com.example.lifeline"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "176912889439-mc5qkr3ufddt9il3mnfdbvsqj4asf66k.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDr_T13o1XMp_XMLKUwoA9WGtJhHiSStEo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeline-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: LifeLine ${{ github.ref_name }}
          body: |
            ## LifeLine ${{ github.ref_name }} - Care Before Crisis

            ### Install on Android
            1. Download app-release.apk below
            2. Go to Settings > Security > Install Unknown Apps > Enable
            3. Open the APK and tap Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
