name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeline-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          name: LifeLine ${{ github.ref_name }}
          body: |
            ## LifeLine ${{ github.ref_name }}

            ### 📱 Download
            Download the APK below and install on your Android device.

            ### What's new
            - Full Firebase Auth + Firestore integration
            - 10+ health features
            - Emergency SOS with GPS
            - Health Wallet QR code

            ### Install Instructions
            1. Download `app-arm64-v8a-release.apk`
            2. Enable **Unknown Sources** in Android Settings
            3. Install and create your account
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
